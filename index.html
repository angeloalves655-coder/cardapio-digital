<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Cardápio Digital</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 15px;
      color: #333;
    }

    header {
      text-align: center;
      background-color: #e63946;
      color: white;
      padding: 20px;
      border-radius: 8px;
    }

    .produto-card {
      background: white;
      border: 1px solid #ddd;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .produto-info h3 { margin: 0 0 5px 0; }
    .produto-info p { margin: 0; color: #666; font-size: 14px; }
    .preco { font-weight: bold; color: #2b9348; }

    button {
      background-color: #2b9348;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    .carrinho {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      border: 2px solid #e63946;
    }

    input {
      width: 100%;
      padding: 8px;
      margin: 5px 0 15px 0;
      box-sizing: border-box;
    }

    .btn-whatsapp {
      width: 100%;
      background-color: #25d366;
      font-size: 16px;
      font-weight: bold;
      padding: 12px;
    }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <h1>🍔 Lanchonete do Zé</h1>
    <p>Faça seu pedido online e receba no WhatsApp!</p>
  </header>

  <!-- Lista de Produtos -->
  <main>
    <h2>Cardápio</h2>
    <div id="produtos-container">
      <!-- Os produtos vão aparecer aqui via JS -->
    </div>

    <!-- Carrinho de Compras -->
    <section class="carrinho">
      <h2>Seu Pedido</h2>
      <ul id="itens-carrinho">
        <li>Carrinho vazio</li>
      </ul>
      <p><strong>Total: R$ <span id="total">0,00</span></strong></p>

      <!-- Formulário de Entrega -->
      <label>Seu Nome:</label>
      <input type="text" id="nome-cliente" placeholder="Ex: João Silva">

      <label>Endereço / Mesa:</label>
      <input type="text" id="endereco-cliente" placeholder="Ex: Mesa 04 ou Rua X, 123">

      <button onclick="enviarParaWhatsApp()" class="btn-whatsapp">
        Enviar Pedido via WhatsApp
      </button>
    </section>
  </main>

  <script>
    // 1. Dados dos Produtos
    const produtos = [
      { id: 1, nome: "X-Burguer Tradicional", preco: 22.00, desc: "Pão, hambúrguer artesanal, queijo e salada." },
      { id: 2, nome: "Batata Frita Grande", preco: 15.00, desc: "Porção de 300g crocante e sequinha." },
      { id: 3, nome: "Coca-Cola Lata 350ml", preco: 6.00, desc: "Gelada." }
    ];

    // Carrinho em memória
    let carrinho = [];

    // Seu número de WhatsApp configurado:
    const TELEFONE_ESTABELECIMENTO = "5519994604562"; 

    // 2. Renderizar produtos na tela
    function renderizarProdutos() {
      const container = document.getElementById("produtos-container");
      container.innerHTML = "";

      produtos.forEach(prod => {
        container.innerHTML += `
          <div class="produto-card">
            <div class="produto-info">
              <h3>${prod.nome}</h3>
              <p>${prod.desc}</p>
              <span class="preco">R$ ${prod.preco.toFixed(2)}</span>
            </div>
            <button onclick="adicionarAoCarrinho(${prod.id})">+ Adicionar</button>
          </div>
        `;
      });
    }

    // 3. Adicionar item ao carrinho
    function adicionarAoCarrinho(id) {
      const item = produtos.find(p => p.id === id);
      carrinho.push(item);
      atualizarCarrinho();
    }

    // 4. Atualizar total e lista do carrinho
    function atualizarCarrinho() {
      const lista = document.getElementById("itens-carrinho");
      const totalEl = document.getElementById("total");
      
      if (carrinho.length === 0) {
        lista.innerHTML = "<li>Carrinho vazio</li>";
        totalEl.innerText = "0,00";
        return;
      }

      lista.innerHTML = "";
      let total = 0;

      carrinho.forEach(item => {
        lista.innerHTML += `<li>${item.nome} - R$ ${item.preco.toFixed(2)}</li>`;
        total += item.preco;
      });

      totalEl.innerText = total.toFixed(2).replace('.', ',');
    }

    // 5. Enviar mensagem formatada para o WhatsApp
    function enviarParaWhatsApp() {
      const nome = document.getElementById("nome-cliente").value;
      const endereco = document.getElementById("endereco-cliente").value;

      if (carrinho.length === 0) {
        alert("Seu carrinho está vazio!");
        return;
      }

      if (!nome || !endereco) {
        alert("Por favor, informe seu Nome e o Endereço/Mesa.");
        return;
      }

      let resumoItens = "";
      let total = 0;
      carrinho.forEach(item => {
        resumoItens += `• ${item.nome} - R$ ${item.preco.toFixed(2)}\n`;
        total += item.preco;
      });

      const mensagem = `*NOVO PEDIDO DE COMPRA*\n\n` +
                       `*Cliente:* ${nome}\n` +
                       `*Mesa/Endereço:* ${endereco}\n\n` +
                       `*Itens do Pedido:*\n${resumoItens}\n` +
                       `*Total:* R$ ${total.toFixed(2).replace('.', ',')}`;

      const mensagemURLEncoded = encodeURIComponent(mensagem);
      window.open(`https://wa.me/${TELEFONE_ESTABELECIMENTO}?text=${mensagemURLEncoded}`, '_blank');
    }

    // Inicializa ao abrir o site
    renderizarProdutos();
  </script>
</body>
</html>
